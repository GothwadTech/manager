name: Build Signed Release APK & Play Store AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.12 - leave empty for auto 1.0.<build_number>)'
        required: false
        default: ''
      version_code:
        description: 'Version Code (Integer, e.g. 12 - leave blank for auto github.run_number)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable and Validate
        run: |
          chmod +x ./gradlew
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || ! jar tf gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
            echo "gradle-wrapper.jar is missing or corrupted. Regenerating wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi

      - name: Restore Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Decoding debug.keystore from debug.keystore.base64..."
              tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || true
            fi
            if [ ! -s "debug.keystore" ]; then
              echo "Generating fallback debug.keystore..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          echo "debug.keystore status: $(ls -l debug.keystore)"

      - name: Determine Version Code and Name
        id: versioning
        run: |
          if [ -n "${{ inputs.version_code }}" ]; then
            V_CODE="${{ inputs.version_code }}"
          else
            V_CODE="${{ github.run_number }}"
          fi

          if [ -n "${{ inputs.version_name }}" ]; then
            V_NAME="${{ inputs.version_name }}"
          else
            V_NAME="1.0.${V_CODE}"
          fi

          echo "Determined Version Code: $V_CODE"
          echo "Determined Version Name: $V_NAME"
          echo "v_code=$V_CODE" >> $GITHUB_OUTPUT
          echo "v_name=$V_NAME" >> $GITHUB_OUTPUT

      - name: Build Release APK and Debug APK with Gradle
        run: |
          ./gradlew assembleRelease assembleDebug \
            -PversionCode=${{ steps.versioning.outputs.v_code }} \
            -PversionName=${{ steps.versioning.outputs.v_name }} \
            --no-daemon

      - name: Build Play Store AAB Bundle with Gradle
        run: |
          ./gradlew bundleRelease \
            -PversionCode=${{ steps.versioning.outputs.v_code }} \
            -PversionName=${{ steps.versioning.outputs.v_name }} \
            --no-daemon

      - name: Sign Release APK & AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY || secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE || secrets.RELEASE_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ALIAS || secrets.KEY_ALIAS || secrets.KEY_NAME }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEY_PASS }}
          V_NAME: ${{ steps.versioning.outputs.v_name }}
        run: |
          echo "=== Checking Required Signing Secrets ==="
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "⚠️ NOTICE: Repository secret SIGNING_KEY not set. Using debug.keystore for Release signing..."
            KS_PATH="debug.keystore"
            KEYSTORE_PASS="android"
            KEY_PASS="android"
            ACTUAL_ALIAS="androiddebugkey"
          else
            if [ -z "$KEYSTORE_PASS" ]; then
              echo "❌ ERROR: KEY_STORE_PASSWORD secret is MISSING!"
              exit 1
            fi
            if [ -z "$KEY_ALIAS" ]; then
              echo "❌ ERROR: ALIAS secret is MISSING!"
              exit 1
            fi
            if [ -z "$KEY_PASS" ]; then
              echo "❌ ERROR: KEY_PASSWORD secret is MISSING!"
              exit 1
            fi
            echo "✅ All 4 signing secrets found in repository."
            echo "Keystore Secret size: ${#KEYSTORE_BASE64} characters"
            echo "Target Alias: $KEY_ALIAS"
            echo "========================================="

            # Decode permanent keystore
            KS_PATH="/tmp/gothwad_release_key.jks"
            rm -f "$KS_PATH"
            
            echo "Decoding Keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$KS_PATH" || echo "$KEYSTORE_BASE64" | base64 -d > "$KS_PATH"

            if [ ! -s "$KS_PATH" ]; then
              echo "❌ ERROR: Failed to decode base64 keystore! File is empty or invalid base64."
              exit 1
            fi

            # Verify keystore password and alias
            echo "Verifying keystore password and listing aliases..."
            if ! keytool -list -keystore "$KS_PATH" -storepass "$KEYSTORE_PASS" > /tmp/keytool_output.txt 2>&1; then
              echo "❌ ERROR: Keystore password incorrect or keystore corrupted!"
              cat /tmp/keytool_output.txt
              exit 1
            fi

            ACTUAL_ALIAS="$KEY_ALIAS"
          fi
          echo "Using Keystore: $KS_PATH, Alias: $ACTUAL_ALIAS"

          echo "Locating generated Release APK, Debug APK, and AAB..."
          echo "Using Keystore Alias: $ACTUAL_ALIAS"
          
          # Find latest zipalign and apksigner dynamically
          ZIPALIGN=$(find $ANDROID_HOME/build-tools/ -name "zipalign" | sort -V | tail -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name "apksigner" | sort -V | tail -n 1)
          
          # 1. Sign APK
          if [ -n "$UNSIGNED_APK" ]; then
            UNALIGNED_TEMP="/tmp/unaligned_temp.apk"
            if [ -n "$ZIPALIGN" ]; then
              $ZIPALIGN -v -p 4 "$UNSIGNED_APK" "$UNALIGNED_TEMP" || cp "$UNSIGNED_APK" "$UNALIGNED_TEMP"
            else
              cp "$UNSIGNED_APK" "$UNALIGNED_TEMP"
            fi
            
            echo "Signing Release APK with apksigner..."
            $APKSIGNER sign \
              --ks "$KS_PATH" \
              --ks-key-alias "$ACTUAL_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --out output_release/GothwadManager-v${V_NAME}-Release.apk \
              "$UNALIGNED_TEMP" || \
            $APKSIGNER sign \
              --ks "$KS_PATH" \
              --ks-key-alias "$ACTUAL_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --key-pass "pass:$KEYSTORE_PASS" \
              --out output_release/GothwadManager-v${V_NAME}-Release.apk \
              "$UNALIGNED_TEMP"
              
            $APKSIGNER verify --verbose output_release/GothwadManager-v${V_NAME}-Release.apk
            rm -f "$UNALIGNED_TEMP"
            echo "✅ Successfully signed Release APK!"
          else
            echo "❌ ERROR: No unsigned release APK found to sign!"
            exit 1
          fi
          
          # 2. Sign Play Store AAB Bundle using jarsigner
          if [ -n "$UNSIGNED_AAB" ]; then
            cp "$UNSIGNED_AAB" output_release/GothwadManager-v${V_NAME}-PlayStore.aab
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KS_PATH" \
              -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS" \
              output_release/GothwadManager-v${V_NAME}-PlayStore.aab \
              "$ACTUAL_ALIAS" || \
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KS_PATH" \
              -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
              output_release/GothwadManager-v${V_NAME}-PlayStore.aab \
              "$ACTUAL_ALIAS"
            echo "✅ Successfully signed Play Store AAB!"
          fi

          # Securely destroy the temporary release keystore file if created
          if [ "$KS_PATH" != "debug.keystore" ]; then
            rm -f "$KS_PATH"
            echo "Release keystore securely cleaned up."
          fi

      - name: Create GitHub Release on Push or Tag
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.versioning.outputs.v_name }}
          name: v${{ steps.versioning.outputs.v_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            output_release/GothwadManager-v${{ steps.versioning.outputs.v_name }}-Release.apk
            output_release/GothwadManager-v${{ steps.versioning.outputs.v_name }}-Debug.apk
            output_release/GothwadManager-v${{ steps.versioning.outputs.v_name }}-PlayStore.aab

      - name: Upload Signed Release APK, Debug APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GothwadManager-v${{ steps.versioning.outputs.v_name }}-Build${{ steps.versioning.outputs.v_code }}
          path: output_release/
