name: Release to GitHub Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Name (e.g. 1.0.12 - leave empty for auto 1.0.<build_number>)'
        required: false
        default: ''
      version_code:
        description: 'Version Code (Integer, e.g. 12 - leave blank for auto github.run_number)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build_release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Determine Version Code and Name
        id: versioning
        run: |
          if [ -n "${{ inputs.version_code }}" ]; then
            V_CODE="${{ inputs.version_code }}"
          else
            V_CODE="${{ github.run_number }}"
          fi

          if [ -n "${{ inputs.version }}" ]; then
            V_NAME="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            V_NAME="${GITHUB_REF_NAME#v}"
          else
            V_NAME="1.0.${V_CODE}"
          fi

          echo "Determined Version Code: $V_CODE"
          echo "Determined Version Name: $V_NAME"
          echo "v_code=$V_CODE" >> $GITHUB_OUTPUT
          echo "v_name=$V_NAME" >> $GITHUB_OUTPUT

      - name: Build Release APK and Debug APK
        run: |
          ./gradlew assembleRelease assembleDebug \
            -PversionCode=${{ steps.versioning.outputs.v_code }} \
            -PversionName=${{ steps.versioning.outputs.v_name }} \
            --no-daemon

      - name: Build Play Store AAB Bundle
        run: |
          ./gradlew bundleRelease \
            -PversionCode=${{ steps.versioning.outputs.v_code }} \
            -PversionName=${{ steps.versioning.outputs.v_name }} \
            --no-daemon

      - name: Sign Release APK & AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY || secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE || secrets.RELEASE_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.KEYSTORE_PASS || secrets.KEY_PASS || secrets.KEY_PASSWORD || 'android123' }}
          KEY_ALIAS: ${{ secrets.ALIAS || secrets.KEY_ALIAS || secrets.KEY_NAME || '' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEY_PASS || secrets.KEY_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.KEYSTORE_PASS || 'android123' }}
          V_NAME: ${{ steps.versioning.outputs.v_name }}
        run: |
          echo "=== GitHub Secrets Diagnostic ==="
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore Secret: FOUND (${#KEYSTORE_BASE64} chars)"
          else
            echo "Keystore Secret: NOT FOUND / EMPTY (will use self-contained keystore)"
          fi
          if [ -n "$KEY_ALIAS" ]; then
            echo "Key Alias: $KEY_ALIAS"
          else
            echo "Key Alias: auto-detect"
          fi
          echo "=================================="

          mkdir -p release_out
          APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          AAB=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)

          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" release_out/GothwadManager-v${V_NAME}-Debug.apk
            echo "Copied Debug APK: release_out/GothwadManager-v${V_NAME}-Debug.apk"
          fi

          # Store keystore in secure temporary location outside release outputs
          KS_PATH="/tmp/release_key.jks"
          rm -f "$KS_PATH"
          
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding Keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$KS_PATH" || echo "$KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
          fi

          if [ ! -s "$KS_PATH" ]; then
            echo "⚠️ No valid Keystore from secrets! Generating self-contained signing keystore..."
            DEFAULT_ALIAS="${KEY_ALIAS:-gothwad_key}"
            # In Java 17 PKCS12 keystores, storepass and keypass MUST be identical
            KEYSTORE_PASS="${KEYSTORE_PASS:-android123}"
            KEY_PASS="$KEYSTORE_PASS"
            keytool -genkey -v \
              -keystore "$KS_PATH" \
              -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$DEFAULT_ALIAS" \
              -dname "CN=Gothwad Manager, O=Gothwad, C=IN" \
              -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS"
          fi

          # Dynamically detect exact Alias name from the keystore
          DETECTED_ALIAS=$(keytool -list -v -keystore "$KS_PATH" -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -i "Alias name:" | head -n 1 | sed 's/.*Alias name: //I' | tr -d '\r' | xargs)
          if [ -z "$DETECTED_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            DETECTED_ALIAS=$(keytool -list -v -keystore "$KS_PATH" -storepass "$KEY_PASS" 2>/dev/null | grep -i "Alias name:" | head -n 1 | sed 's/.*Alias name: //I' | tr -d '\r' | xargs)
          fi
          
          if [ -n "$KEY_ALIAS" ]; then
            ACTUAL_ALIAS="$KEY_ALIAS"
          elif [ -n "$DETECTED_ALIAS" ]; then
            ACTUAL_ALIAS="$DETECTED_ALIAS"
          else
            ACTUAL_ALIAS="gothwad_key"
          fi
          
          echo "Using Keystore Alias: $ACTUAL_ALIAS"

          ZIPALIGN=$(find $ANDROID_HOME/build-tools/ -name "zipalign" | sort -V | tail -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name "apksigner" | sort -V | tail -n 1)
          
          if [ -n "$APK" ]; then
            UNALIGNED_TEMP="/tmp/unaligned_temp.apk"
            if [ -n "$ZIPALIGN" ]; then
              $ZIPALIGN -v -p 4 "$APK" "$UNALIGNED_TEMP" || cp "$APK" "$UNALIGNED_TEMP"
            else
              cp "$APK" "$UNALIGNED_TEMP"
            fi

            echo "Signing APK with apksigner..."
            $APKSIGNER sign \
              --ks "$KS_PATH" \
              --ks-key-alias "$ACTUAL_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --out release_out/GothwadManager-v${V_NAME}-Release.apk \
              "$UNALIGNED_TEMP" || \
            $APKSIGNER sign \
              --ks "$KS_PATH" \
              --ks-key-alias "$ACTUAL_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --key-pass "pass:$KEYSTORE_PASS" \
              --out release_out/GothwadManager-v${V_NAME}-Release.apk \
              "$UNALIGNED_TEMP" || \
            $APKSIGNER sign \
              --ks "$KS_PATH" \
              --ks-key-alias "$ACTUAL_ALIAS" \
              --ks-pass "pass:$KEY_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --out release_out/GothwadManager-v${V_NAME}-Release.apk \
              "$UNALIGNED_TEMP"
            
            $APKSIGNER verify --verbose release_out/GothwadManager-v${V_NAME}-Release.apk
            rm -f "$UNALIGNED_TEMP"
          fi

          if [ -n "$AAB" ]; then
            cp "$AAB" release_out/GothwadManager-v${V_NAME}-PlayStore.aab
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KS_PATH" \
              -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS" \
              release_out/GothwadManager-v${V_NAME}-PlayStore.aab \
              "$ACTUAL_ALIAS" || \
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KS_PATH" \
              -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
              release_out/GothwadManager-v${V_NAME}-PlayStore.aab \
              "$ACTUAL_ALIAS"
            echo "Successfully signed Play Store AAB!"
          fi

          # Securely destroy the temporary keystore file
          rm -f "$KS_PATH"
          echo "Keystore securely cleaned up."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.versioning.outputs.v_name }}
          name: v${{ steps.versioning.outputs.v_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_out/GothwadManager-v${{ steps.versioning.outputs.v_name }}-Release.apk
            release_out/GothwadManager-v${{ steps.versioning.outputs.v_name }}-Debug.apk
            release_out/GothwadManager-v${{ steps.versioning.outputs.v_name }}-PlayStore.aab
