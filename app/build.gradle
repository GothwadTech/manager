plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.gothwad.manager'
    compileSdk 36

    defaultConfig {
        applicationId 'com.gothwad.manager'
        minSdk 21
        targetSdk 34
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 10
        versionName project.hasProperty('versionName') ? project.property('versionName').toString() : '1.3.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // JDK 21 no longer emits Java 7 bytecode. Java 8 bytecode is desugared
        // by D8 and remains compatible with Android 4.0 (API 14).
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        // This build is intended for direct sideloading on legacy TV boxes.
        // A Play Store flavor will need a current target SDK and the modern
        // all-files access flow.
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.google.zxing:core:3.3.3'
    testImplementation 'junit:junit:4.13.2'
}
