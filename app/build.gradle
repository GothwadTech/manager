plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gothwad.manager'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId "com.gothwad.manager"
        minSdk 24
        targetSdk 36
        versionCode 40001
        versionName "4.0.0"
        vectorDrawables.useSupportLibrary = true

        buildConfigField "String", "LICENSE_KEY", '""'
        buildConfigField "String", "DROPBOX_CLIENT_ID", '""'
        buildConfigField "String", "DROPBOX_CLIENT_KEY", '""'
        buildConfigField "String", "ONEDRIVE_CLIENT_ID", '""'
        buildConfigField "String", "ONEDRIVE_CLIENT_KEY", '""'
        buildConfigField "String", "BOX_CLIENT_ID", '""'
        buildConfigField "String", "BOX_CLIENT_KEY", '""'
        buildConfigField "String", "PLAYSTORE_LICENSE_KEY", '""'
        buildConfigField "String", "MERCHANT_ID", '""'
        buildConfigField "String", "GOOGLE_DRIVE_CLIENT_ID", '""'
    }

    signingConfigs {
        debug {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    packaging {
        resources {
            excludes += [
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/DEPENDENCIES'
            ]
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'com.jaredrummler:android-processes:1.1.1'
    implementation 'com.github.mjdev:libaums:0.5.5'
    implementation 'org.apache.ftpserver:ftpserver-core:1.1.1'
    implementation 'commons-net:commons-net:3.6'
    implementation 'com.zsoltsafrany:needle:1.0.0'
    implementation 'com.cloudrail:cloudrail-si-android:2.22.4'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    implementation 'com.github.javiersantos:AppUpdater:2.6.5'
}
